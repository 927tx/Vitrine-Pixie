
name: Build Vitrine beta 16 + Pixie 1.4

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct HTTPS URL to Spotify 9.1.90 + Vitrine beta 16 IPA (without Pixie)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout Vitrine-Pixie
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          brew install make dpkg ldid

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Clone pinned Vitrine source
        run: |
          set -euo pipefail

          git clone https://github.com/My-Name-Is-Jeff/vitrine.git vitrine-upstream

          git -C vitrine-upstream checkout \
            36d3b38ec39c0b8b696f1d2db026ca9e9939bf14

          git -C vitrine-upstream apply --check \
            ../patches/vitrine-pixie.patch

          git -C vitrine-upstream apply \
            ../patches/vitrine-pixie.patch

      - name: Download input IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail

          case "$IPA_URL" in
            https://*) ;;
            *) echo "A direct HTTPS IPA URL is required"; exit 1 ;;
          esac

          curl --proto '=https' --proto-redir '=https' \
            --location --fail --retry 3 \
            "$IPA_URL" \
            --output "$RUNNER_TEMP/source.ipa"

          unzip -tq "$RUNNER_TEMP/source.ipa"

      - name: Validate Pixie source
        run: |
          set -euo pipefail

          python3 NativeDownloads/tools/validate_vitrine_9190.py
          python3 NativeDownloads/tools/test.py
          python3 NativeDownloads/tools/test_settings_ui.py --compile-only

      - name: Build Vitrine + Pixie IPA
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail

          python3 NativeDownloads/tools/build.py \
            "$RUNNER_TEMP/source.ipa" \
            --theos "$THEOS" \
            --output-dir "$RUNNER_TEMP/pixie-release" \
            --jobs 4 || {
              echo "Build failed. Printing available logs:"
              for log in "$RUNNER_TEMP/pixie-release/"*.log; do
                if [ -f "$log" ]; then
                  echo "===== $log ====="
                  tail -n 150 "$log"
                fi
              done
              exit 1
            }

      - name: Upload Pixie 1.4 IPA and logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Spotify-9.1.90-Vitrine-b16-Pixie-v1.4
          path: ${{ runner.temp }}/pixie-release/
          if-no-files-found: warn
          retention-days: 7
