
name: Build Spotify Vitrine + Pixie

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to Spotify + Vitrine IPA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Pixie repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: |
          brew install make dpkg ldid

      - name: Download Vitrine IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          curl --fail --location --show-error \
            "$IPA_URL" -o ipa/vitrine.ipa
          unzip -tq ipa/vitrine.ipa

      - name: Verify Pixie builder
        run: |
          set -euo pipefail

          BUILDER="NativeDownloads/tools/build_vitrine_9190.py"

          if [ ! -f "$BUILDER" ]; then
            echo "::error::Pixie builder not found"
            exit 1
          fi

          echo "Pixie builder found."
          python3 -m py_compile "$BUILDER"

      - name: Show next build requirements
        run: |
          echo "### Pixie preflight passed" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Builder and IPA are available." \
            >> "$GITHUB_STEP_SUMMARY"
          echo "Next: compile patched Vitrine and run builder." \
            >> "$GITHUB_STEP_SUMMARY"
