
name: Build Spotify Vitrine + Pixie

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct URL to Spotify 9.1.90 + Vitrine beta 13 IPA"
        required: true
        type: string

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - name: Checkout Pixie
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          brew install make dpkg ldid

      - name: Install Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Download Vitrine IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -euo pipefail
          mkdir -p ipa
          curl -fL --retry 3 "$IPA_URL" -o ipa/vitrine.ipa
          unzip -tq ipa/vitrine.ipa

      - name: Clone pinned Vitrine source
        run: |
          set -euo pipefail
          git clone https://github.com/My-Name-Is-Jeff/vitrine.git vitrine
          git -C vitrine checkout 914343731f66ccb2e639b8164a36be849a043276

      - name: Apply Pixie source patch
        run: |
          set -euo pipefail
          git -C vitrine apply --check ../patches/vitrine-pixie.patch
          git -C vitrine apply ../patches/vitrine-pixie.patch

      - name: Generate Spotify flags
        run: |
          set -euo pipefail
          mkdir -p vitrine/ipa
          cp ipa/vitrine.ipa vitrine/ipa/spotify.ipa
          cd vitrine
          make flags IPA=ipa/spotify.ipa

      - name: Compile patched Vitrine
        run: |
          set -euo pipefail
          cd vitrine
          env -u MAKELEVEL gmake -C tweak package SG_DRIVER=0 -j4

      - name: Prepare Pixie Vitrine dylib
        run: |
          set -euo pipefail
          cp vitrine/tweak/.theos/obj/spotifyglass.dylib \
            /tmp/pixie-spotifyglass.dylib
          codesign --force --sign - --timestamp=none \
            /tmp/pixie-spotifyglass.dylib

      - name: Build Pixie IPA
        run: |
          set -euo pipefail
          python3 NativeDownloads/tools/build_vitrine_9190.py \
            ipa/vitrine.ipa \
            --vitrine-dylib /tmp/pixie-spotifyglass.dylib

      - name: Validate finished IPA
        run: |
          set -euo pipefail
          IPA="NativeDownloads/outputs/pixie-9.1.90/Spotify-9.1.90-Pixie.ipa"
          test -s "$IPA"
          unzip -tq "$IPA"
          echo "Pixie IPA archive validated."

      - name: Upload finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spotify-9.1.90-Vitrine-Pixie
          path: NativeDownloads/outputs/pixie-9.1.90/Spotify-9.1.90-Pixie.ipa
          if-no-files-found: error
